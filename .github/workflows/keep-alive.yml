name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */6 * *'  # 6일마다 실행
  workflow_dispatch:        # 수동 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ https://ejodleakdnzwnbimfxty.supabase.co/rest/v1/ }}/rest/v1/characters?select=id&limit=1" \
            -H "apikey: ${{ sb_publishable_poNpQ-CvRwiCP3D8m-Qb-w_MWR0aT8j }}" \
            -H "Authorization: Bearer ${{ sb_publishable_poNpQ-CvRwiCP3D8m-Qb-w_MWR0aT8j }}")
          echo "Response status: $STATUS"